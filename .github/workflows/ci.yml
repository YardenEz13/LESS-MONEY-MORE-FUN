name: smart-benefits-recall

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # The catalog ages whether or not anyone pushes, and past 45 days a row stops
  # being shown. It once sat unrefreshed for two months with every check green.
  # A failed scheduled run emails the repo owner, with no computer of theirs on.
  freshness:
    name: catalog is being refreshed
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e '
            const rows = require("./data/benefits.json");
            const age = (b) => (Date.now() - Date.parse(b.last_verified_at)) / 864e5;
            const live = rows.filter((b) => age(b) <= 45).length;
            const newest = Math.floor(Math.min(...rows.map(age)));
            console.log(`${live}/${rows.length} rows live, newest verified ${newest} days ago`);
            if (newest > 14) process.exit(1);
          '

  core:
    name: engine + pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate:data
      - run: npm test
      # The pipeline scripts have their own suite, and it was not running here.
      # A retraction bug in scrape-easy sat red for several commits because of
      # it — the tests existed and nothing looked at them.
      - run: npm run test:scripts
      - run: npm run typecheck
      # No API key in CI: prove the scrape + wiring still runs end to end
      # against the committed fixtures without calling the model.
      - run: npm run extract -- --offline --scrape-only

  mobile:
    name: app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # apps/mobile is deliberately outside the npm workspace (it reaches
      # @sbr/core via source-path aliases, not a symlinked node_modules
      # entry), so its own install never resolves @sbr/core's dependencies —
      # notably zod, which packages/core/src/types.ts imports directly and
      # apps/mobile type-checks against. Install the workspace root first.
      - run: npm install
      - run: npm install
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
